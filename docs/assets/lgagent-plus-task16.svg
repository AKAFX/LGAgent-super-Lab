<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">LGAgent++ OATH-RAG and CAPE-V architecture</title>
  <desc id="desc">A paper-ready flow diagram from legal question through structured analysis, evidence retrieval, candidate verification, risk routing, and audited output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17324d"/>
      <stop offset="1" stop-color="#24577b"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#087f8c"/>
      <stop offset="1" stop-color="#24a7a0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#17324d" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#557087"/>
    </marker>
    <style>
      .label{font:600 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}
      .small{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#4b6478}
      .white{fill:#fff}
      .section{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.5px}
      .line{stroke:#557087;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#7a91a4;stroke-width:2;stroke-dasharray:7 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="820" rx="28" fill="url(#bg)"/>
  <text x="70" y="70" class="label" font-size="30">LGAgent++: Evidence-Verified Legal Reasoning</text>
  <text x="70" y="99" class="small">Option-aligned temporal retrieval + permutation-aware verification + adaptive compute</text>

  <g filter="url(#shadow)">
    <rect x="70" y="160" width="210" height="112" rx="18" fill="url(#navy)"/>
    <text x="175" y="200" text-anchor="middle" class="section white">INPUT</text>
    <text x="175" y="232" text-anchor="middle" class="white" font-family="sans-serif" font-size="20">Legal question</text>
    <text x="175" y="254" text-anchor="middle" class="white" font-family="sans-serif" font-size="14">A / B / C / D</text>

    <rect x="350" y="145" width="250" height="142" rx="18" fill="#fff"/>
    <text x="475" y="182" text-anchor="middle" class="section" fill="#24577b">STRUCTURE</text>
    <text x="475" y="215" text-anchor="middle" class="label">Lawyer A</text>
    <text x="475" y="242" text-anchor="middle" class="small">facts · jurisdiction · date</text>
    <text x="475" y="264" text-anchor="middle" class="small">option claims · exceptions</text>

    <rect x="670" y="145" width="250" height="142" rx="18" fill="#fff"/>
    <text x="795" y="182" text-anchor="middle" class="section" fill="#24577b">CONTROL</text>
    <text x="795" y="215" text-anchor="middle" class="label">Judge</text>
    <text x="795" y="242" text-anchor="middle" class="small">retrieval plan · stop rule</text>
    <text x="795" y="264" text-anchor="middle" class="small">answer-neutral guidance</text>

    <rect x="990" y="160" width="330" height="112" rx="18" fill="url(#navy)"/>
    <text x="1155" y="200" text-anchor="middle" class="section white">BLIND BASELINE</text>
    <text x="1155" y="233" text-anchor="middle" class="white" font-family="sans-serif" font-size="20">Lawyer B0 → initial answer</text>
    <text x="1155" y="256" text-anchor="middle" class="white" font-family="sans-serif" font-size="14">preserved for comparison</text>
  </g>

  <path class="line" d="M280 216 H342"/>
  <path class="line" d="M600 216 H662"/>
  <path class="line" d="M920 216 H982"/>

  <g filter="url(#shadow)">
    <rect x="70" y="360" width="600" height="275" rx="22" fill="#fff"/>
    <rect x="70" y="360" width="600" height="54" rx="22" fill="url(#teal)"/>
    <rect x="70" y="392" width="600" height="22" fill="url(#teal)"/>
    <text x="100" y="395" class="section white">OATH-RAG · KNOWLEDGE CONTROL</text>

    <rect x="105" y="450" width="150" height="72" rx="14" fill="#e9f6f5"/>
    <text x="180" y="480" text-anchor="middle" class="label" font-size="16">Three lanes</text>
    <text x="180" y="504" text-anchor="middle" class="small">support · refute · exception</text>

    <rect x="295" y="450" width="150" height="72" rx="14" fill="#e9f6f5"/>
    <text x="370" y="480" text-anchor="middle" class="label" font-size="16">Hard gates</text>
    <text x="370" y="504" text-anchor="middle" class="small">time · authority · jurisdiction</text>

    <rect x="485" y="450" width="150" height="72" rx="14" fill="#e9f6f5"/>
    <text x="560" y="480" text-anchor="middle" class="label" font-size="16">Hybrid retrieval</text>
    <text x="560" y="504" text-anchor="middle" class="small">BM25 · dense · graph</text>

    <rect x="200" y="555" width="340" height="52" rx="14" fill="#d6eeec"/>
    <text x="370" y="587" text-anchor="middle" class="label" font-size="17">Audited Evidence Matrix</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="730" y="360" width="590" height="275" rx="22" fill="#fff"/>
    <rect x="730" y="360" width="590" height="54" rx="22" fill="url(#navy)"/>
    <rect x="730" y="392" width="590" height="22" fill="url(#navy)"/>
    <text x="760" y="395" class="section white">CAPE-V · REASONING CONTROL</text>

    <rect x="765" y="450" width="150" height="72" rx="14" fill="#e8eef4"/>
    <text x="840" y="480" text-anchor="middle" class="label" font-size="16">Candidates</text>
    <text x="840" y="504" text-anchor="middle" class="small">independent samples</text>

    <rect x="950" y="450" width="150" height="72" rx="14" fill="#e8eef4"/>
    <text x="1025" y="480" text-anchor="middle" class="label" font-size="16">Permutation</text>
    <text x="1025" y="504" text-anchor="middle" class="small">position stability</text>

    <rect x="1135" y="450" width="150" height="72" rx="14" fill="#e8eef4"/>
    <text x="1210" y="480" text-anchor="middle" class="label" font-size="16">5 verifiers</text>
    <text x="1210" y="504" text-anchor="middle" class="small">rule · fact · exception</text>

    <rect x="855" y="555" width="340" height="52" rx="14" fill="#dce6ef"/>
    <text x="1025" y="587" text-anchor="middle" class="label" font-size="17">Risk score + budget guard</text>
  </g>

  <path class="dash" d="M475 287 V330 H370 V352"/>
  <path class="dash" d="M795 287 V330 H1025 V352"/>
  <path class="line" d="M670 581 H722"/>

  <g filter="url(#shadow)">
    <rect x="285" y="700" width="830" height="76" rx="20" fill="#fff"/>
    <rect x="285" y="700" width="14" height="76" rx="7" fill="#d28b2c"/>
    <text x="330" y="732" class="section" fill="#a45f12">AUDITED OUTPUT</text>
    <text x="330" y="759" class="small">answer · evidence IDs · verification reports · route · tokens · latency · failures</text>
    <text x="1075" y="744" text-anchor="end" class="label" font-size="17">JSONL + checkpoint + summary</text>
  </g>
  <path class="line" d="M370 635 V672 H690 V692"/>
  <path class="line" d="M1025 635 V672 H710 V692"/>
</svg>

benchmark:
  benchmark:
    key_map:
      gt_ls: golden_answers
      q_ls: question
    limit: 200
    name: nq
    path: data/Ability_merged_500.jsonl
    seed: 42
    shuffle: false
custom: {}
evaluation:
  metrics:
  - acc
  - f1
  - em
  - coverem
  - stringem
  - rouge-1
  - rouge-2
  - rouge-l
  save_path: output/evaluate_results.json
generation:
  backend: openai
  backend_configs:
    hf:
      batch_size: 8
      gpu_ids: 0
      model_name_or_path: openbmb/MiniCPM4-8B
      trust_remote_code: true
    openai:
    api_key: "${OPENAI_API_KEY}"
      base_delay: 1.0
      base_url: https://api.zhizengzeng.com/v1  # 智增增API地址，可根据实际情况修改
      concurrency: 8
      model_name: deepseek-v3 # 律师B使用的模型名，应与legal_multi_agent_eval2.py中的EVAL_MODEL一致
      retries: 3
    vllm:
      dtype: auto
      gpu_ids: 0
      gpu_memory_utilization: 0.9
      model_name_or_path: openbmb/MiniCPM4-8B
      trust_remote_code: true
  sampling_params:
    chat_template_kwargs:
      enable_thinking: false
    max_tokens: 2048
    temperature: 0.7
    top_p: 0.8
  system_prompt: ''
lgagent_plus:
  enabled: false
  seed: 42
  oath_rag:
    enabled: true
    corpus_path: data/oath/oath_just_laws_strict.jsonl
    corpus_failure_mode: fail_closed
    lexical_top_k: 20
    dense_top_k: 20
    final_top_k_per_lane: 3
    graph_hops: 1
    require_temporal_match: true
    require_authoritative_source: true
  cape_v:
    enabled: true
    initial_candidates: 1
    slow_path_candidates: 1
    permutation_count: 3
    enable_counterfactual: false
    candidate_max_tokens: 1024
    verifiers:
      rule: true
      fact: true
      exception: true
      evidence: true
      entailment: true
    verifier:
      timeout_seconds: 30
      max_attempts: 2
      max_tokens: 512
      weights:
        rule: 1.0
        fact: 1.0
        exception: 1.0
        evidence: 1.0
        entailment: 1.0
    verifier_model:
      backend: openai
      base_url: https://api.zhizengzeng.com/v1
    api_key: "${OPENAI_API_KEY}"
      model_name: deepseek-v3
      temperature: 0.0
      top_p: 1.0
      max_tokens: 512
  risk:
    low_threshold: 0.30
    high_threshold: 0.65
    weights:
      normalized_answer_entropy: 1.0
      permutation_instability: 1.0
      verifier_disagreement: 1.0
      evidence_conflict: 1.0
      missing_evidence_coverage: 1.0
      low_top2_margin: 1.0
    max_rounds: 2
    max_model_calls: 32
    max_total_tokens: 32768
    max_wall_time_seconds: 120
prompt:
  template: prompt/qa_boxed_single_choice_simple.jinja
retriever:
  backend: sentence_transformers
  backend_configs:
    bm25:
      lang: en
      save_path: index/bm25
    infinity:
      bettertransformer: false
      model_warmup: false
      pooling_method: auto
      trust_remote_code: true
    openai:
    api_key: "${OPENAI_API_KEY}"
      base_url: https://api.openai.com/v1
      model_name: text-embedding-3-small
    sentence_transformers:
      sentence_transformers_encode:
        encode_chunk_size: 10000
        normalize_embeddings: false
        psg_prompt_name: document
        psg_task: null
        q_prompt_name: query
        q_task: null
      trust_remote_code: true
  batch_size: 16
  corpus_path: data/corpus_example.jsonl
  embedding_path: embedding/embedding.npy
  gpu_ids: 0
  index_backend: faiss
  index_backend_configs:
    faiss:
      index_chunk_size: 50000
      index_path: index/index.index
      index_use_gpu: true
    milvus:
      collection_name: ultrarag_embeddings
      id_field_name: id
      index_chunk_size: 50000
      index_params:
        index_type: AUTOINDEX
        metric_type: IP
      metric_type: IP
      search_params:
        metric_type: IP
        params: {}
      token: null
      uri: index/milvus_demo.db
      vector_field_name: vector
  is_multimodal: false
  model_name_or_path: openbmb/MiniCPM-Embedding-Light
  overwrite: false
  query_instruction: ''
  top_k: 5
